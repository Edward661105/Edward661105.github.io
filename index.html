<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>口說模擬測驗 · GEPT 中級 第二部分</title>
<style>
  :root {
    --ink: #121820;
    --panel: #1b242e;
    --panel-raised: #222c37;
    --border: #2c3945;
    --text: #eeeae1;
    --text-dim: #93a1ac;
    --amber: #e8a33d;
    --amber-dim: #6b5528;
    --sage: #7fa085;
    --brick: #c1584d;
    --serif: Georgia, "Iowan Old Style", "Noto Serif TC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: 0;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 28px 20px 40px;
  }

  /* ---------- Header ---------- */
  .masthead {
    text-align: center;
    margin-bottom: 28px;
  }
  .masthead .kicker {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .masthead h1 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    margin: 6px 0 0;
    color: var(--text);
  }

  /* ---------- Intro screen ---------- */
  .intro-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 22px;
  }
  .intro-card h2 {
    font-family: var(--serif);
    font-size: 19px;
    margin: 0 0 14px;
  }
  .spec-table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0 20px;
    font-size: 14px;
  }
  .spec-table td {
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
  }
  .spec-table td:last-child {
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .intro-notes {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-dim);
    margin: 0 0 22px;
  }
  .intro-notes li { margin-bottom: 4px; }

  button.primary {
    width: 100%;
    background: var(--amber);
    color: #201405;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.ghost {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-family: var(--sans);
    cursor: pointer;
    margin-top: 10px;
  }

  .error-box {
    background: rgba(193, 88, 77, 0.12);
    border: 1px solid var(--brick);
    color: #f0c9c4;
    border-radius: 10px;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.6;
    margin-top: 16px;
    display: none;
  }

  /* ---------- Progress dots ---------- */
  .progress {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-bottom: 22px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
  }
  .dot.done { background: var(--sage); }
  .dot.active { background: var(--amber); }

  /* ---------- Question screen ---------- */
  .q-screen { display: none; flex-direction: column; align-items: center; flex: 1; }
  .q-meta {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .q-text {
    font-family: var(--serif);
    font-size: 22px;
    line-height: 1.5;
    text-align: center;
    min-height: 92px;
    display: flex;
    align-items: center;
    padding: 0 6px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .q-text.shown { opacity: 1; }

  .ring-wrap {
    position: relative;
    width: 172px; height: 172px;
    margin: 30px 0 18px;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
  .ring-fg { fill: none; stroke: var(--amber); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s ease; }
  .ring-fg.urgent { stroke: var(--brick); }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-num {
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-family: var(--sans);
  }
  .ring-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .status-line {
    font-size: 14px;
    color: var(--amber);
    font-weight: 600;
    min-height: 20px;
    margin-bottom: 10px;
  }

  .caption-box {
    width: 100%;
    min-height: 64px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
  }
  .caption-box .live { color: var(--text); }
  .rec-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--brick);
    margin-right: 8px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  audio.answer-audio {
    width: 100%;
    height: 34px;
    margin-bottom: 10px;
  }

  /* ---------- Results screen ---------- */
  .results-screen { display: none; flex-direction: column; }
  .summary-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .summary-card h2 {
    font-family: var(--serif);
    font-size: 18px;
    margin: 0 0 10px;
  }
  .summary-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-dim);
    margin: 0 0 14px;
  }
  .metric-row { margin-bottom: 10px; }
  .metric-label {
    display: flex; justify-content: space-between;
    font-size: 12.5px; color: var(--text-dim); margin-bottom: 4px;
  }
  .metric-bar-bg { background: var(--panel-raised); border-radius: 6px; height: 7px; overflow: hidden; }
  .metric-bar-fg { height: 100%; background: var(--sage); border-radius: 6px; }

  .q-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .q-card .num {
    font-size: 12px;
    color: var(--amber);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .q-card .qtext {
    font-family: var(--serif);
    font-size: 15.5px;
    margin-bottom: 10px;
  }
  .q-card .field-label {
    font-size: 11px;
    text-transform: none;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .q-card .your-answer {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.55;
  }
  .q-card .feedback {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .q-card .reaction {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--amber);
    border-radius: 50%;
    margin: 40px auto 16px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .analyzing-text {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <div class="kicker">口說模擬測驗</div>
    <h1>GEPT 中級 · 第二部分</h1>
  </div>

  <!-- INTRO -->
  <div class="intro-card" id="introScreen">
    <h2>問答（共 10 題）</h2>
    <table class="spec-table">
      <tr><td>第 1–5 題</td><td>作答 15 秒</td></tr>
      <tr><td>第 6–10 題</td><td>作答 30 秒</td></tr>
      <tr><td>準備時間</td><td>無</td></tr>
    </table>
    <ul class="intro-notes">
      <li>系統會唸出題目，唸完立即開始計時並錄下你的回答</li>
      <li>時間到會自動跳下一題，無法暫停或重來單題</li>
      <li>需要允許瀏覽器使用麥克風，建議使用 Chrome 瀏覽器</li>
      <li>10 題答完後統一產生文法與反應速度回饋</li>
    </ul>
    <button class="primary" id="startBtn">開始測驗</button>
    <div class="error-box" id="errorBox"></div>
  </div>

  <!-- QUESTION SCREEN -->
  <div class="q-screen" id="qScreen">
    <div class="progress" id="progressDots"></div>
    <div class="q-meta" id="qMeta"></div>
    <div class="q-text" id="qText"></div>

    <div class="ring-wrap">
      <svg width="172" height="172" viewBox="0 0 172 172">
        <circle class="ring-bg" cx="86" cy="86" r="78"></circle>
        <circle class="ring-fg" id="ringFg" cx="86" cy="86" r="78"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-num" id="ringNum">–</div>
        <div class="ring-label" id="ringLabel"></div>
      </div>
    </div>

    <div class="status-line" id="statusLine"></div>
    <div class="caption-box" id="captionBox">
      <span class="live" id="captionText">🎙 準備中…</span>
    </div>
  </div>

  <!-- ANALYZING -->
  <div id="analyzingScreen" style="display:none;">
    <div class="spinner"></div>
    <div class="analyzing-text">正在分析 10 題的文法與反應速度…</div>
  </div>

  <!-- RESULTS -->
  <div class="results-screen" id="resultsScreen">
    <div class="summary-card">
      <h2>總評</h2>
      <p class="summary-text" id="summaryText">–</p>
      <div id="metricRows"></div>
    </div>
    <div id="qCardsWrap"></div>
    <button class="ghost" id="restartBtn">再測一次</button>
  </div>
</div>

<script>
const QUESTIONS = [
  { text: "Hi! How was your weekend?", seconds: 15 },
  { text: "Excuse me, could you tell me how to get to the library?", seconds: 15 },
  { text: "I'm sorry I'm late. The bus took forever.", seconds: 15 },
  { text: "Would you like to join us for lunch today?", seconds: 15 },
  { text: "What time does your English class start tomorrow?", seconds: 15 },
  { text: "What do you usually do to relax after a long day at school?", seconds: 30 },
  { text: "My phone broke this morning and I missed an important call. What should I do?", seconds: 30 },
  { text: "What's your favorite subject in school, and why do you like it?", seconds: 30 },
  { text: "If you could travel anywhere in the world, where would you go and why?", seconds: 30 },
  { text: "Can you describe your best friend and what makes your friendship special?", seconds: 30 },
];

const introScreen = document.getElementById('introScreen');
const qScreen = document.getElementById('qScreen');
const analyzingScreen = document.getElementById('analyzingScreen');
const resultsScreen = document.getElementById('resultsScreen');
const startBtn = document.getElementById('startBtn');
const errorBox = document.getElementById('errorBox');
const progressDots = document.getElementById('progressDots');
const qMeta = document.getElementById('qMeta');
const qText = document.getElementById('qText');
const ringFg = document.getElementById('ringFg');
const ringNum = document.getElementById('ringNum');
const ringLabel = document.getElementById('ringLabel');
const statusLine = document.getElementById('statusLine');
const captionText = document.getElementById('captionText');
const restartBtn = document.getElementById('restartBtn');

const RADIUS = 78;
const CIRC = 2 * Math.PI * RADIUS;
ringFg.style.strokeDasharray = CIRC;

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

let results = []; // { question, seconds, transcript, reactionMs, audioUrl }
let micStream = null;

function showError(msg) {
  errorBox.style.display = 'block';
  errorBox.textContent = msg;
}

function buildDots() {
  progressDots.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot' + i;
    progressDots.appendChild(d);
  }
}

function setDot(i, cls) {
  const d = document.getElementById('dot' + i);
  if (d) d.className = 'dot ' + cls;
}

function speak(text) {
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.98;
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

async function runExam() {
  if (!SpeechRecognitionCtor) {
    showError('這個瀏覽器不支援語音辨識（Web Speech API）。請改用電腦版 Chrome 或 Edge 開啟這個頁面再試一次。');
    return;
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    showError('無法取得麥克風權限，請允許瀏覽器存取麥克風後再重新整理頁面。');
    return;
  }

  errorBox.style.display = 'none';
  introScreen.style.display = 'none';
  qScreen.style.display = 'flex';
  buildDots();
  results = [];

  for (let i = 0; i < QUESTIONS.length; i++) {
    setDot(i, 'active');
    await runQuestion(i, QUESTIONS[i]);
    setDot(i, 'done');
  }

  qScreen.style.display = 'none';
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
  }
  await analyzeAll();
}

function runQuestion(index, q) {
  return new Promise(async (resolve) => {
    qMeta.textContent = `第 ${index + 1} / 10 題 · 作答 ${q.seconds} 秒`;
    qText.classList.remove('shown');
    qText.textContent = q.text;
    ringNum.textContent = '–';
    ringLabel.textContent = '';
    ringFg.classList.remove('urgent');
    ringFg.style.transition = 'none';
    ringFg.style.strokeDashoffset = 0;
    captionText.innerHTML = '<span class="rec-dot"></span>錄音中…';
    statusLine.textContent = '播放題目中…';

    await new Promise(r => setTimeout(r, 250));
    qText.classList.add('shown');

    await speak(q.text);

    statusLine.textContent = '作答中，請開始說話';
    ringLabel.textContent = '秒';

    const startTime = performance.now();
    let reactionMs = null;
    let finalTranscript = '';
    let questionActive = true;
    let currentRecognition = null;

    function startRecognitionSession() {
      if (!questionActive) return;
      const rec = new SpeechRecognitionCtor();
      rec.lang = 'en-US';
      rec.continuous = true;
      rec.interimResults = true;

      rec.onresult = (event) => {
        if (reactionMs === null) reactionMs = Math.round(performance.now() - startTime);
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          if (res.isFinal) {
            finalTranscript += res[0].transcript + ' ';
          }
        }
      };
      rec.onerror = () => {};
      rec.onend = () => {
        // Chrome stops recognition after brief silence, or the instance can
        // get stuck after several restarts — spin up a brand new instance
        // each time rather than reusing this one, as long as the question
        // is still running
        if (questionActive) startRecognitionSession();
      };
      try { rec.start(); } catch (e) {}
      currentRecognition = rec;
    }
    startRecognitionSession();

    // record the actual audio too, so the results screen can play it back
    // alongside the transcript
    let audioChunks = [];
    let mediaRecorder = null;
    let audioUrl = null;
    try {
      mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.start();
    } catch (e) {}

    // countdown ring
    requestAnimationFrame(() => {
      ringFg.style.transition = `stroke-dashoffset ${q.seconds}s linear`;
      ringFg.style.strokeDashoffset = CIRC;
    });

    let remaining = q.seconds;
    ringNum.textContent = remaining;
    const tick = setInterval(() => {
      remaining -= 1;
      ringNum.textContent = Math.max(remaining, 0);
      if (remaining <= 3) ringFg.classList.add('urgent');
      if (remaining <= 0) {
        clearInterval(tick);
      }
    }, 1000);

    setTimeout(() => {
      clearInterval(tick);
      questionActive = false;
      try { if (currentRecognition) currentRecognition.stop(); } catch (e) {}
      statusLine.textContent = '時間到';

      const finish = () => {
        const cleanTranscript = finalTranscript.trim();
        captionText.textContent = cleanTranscript
          ? '已收到：' + cleanTranscript
          : '（沒有偵測到語音）';
        results.push({
          question: q.text,
          seconds: q.seconds,
          transcript: cleanTranscript,
          reactionMs: reactionMs,
          audioUrl: audioUrl,
        });
        setTimeout(resolve, 900);
      };

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.onstop = () => {
          if (audioChunks.length) {
            audioUrl = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/webm' }));
          }
          finish();
        };
        try { mediaRecorder.stop(); } catch (e) { finish(); }
      } else {
        finish();
      }
    }, q.seconds * 1000);
  });
}

async function analyzeAll() {
  analyzingScreen.style.display = 'block';

  const payload = results.map((r, i) => ({
    index: i + 1,
    question: r.question,
    time_limit_seconds: r.seconds,
    transcript: r.transcript || '(沒有偵測到語音)',
    reaction_ms: r.reactionMs,
  }));

  const systemPrompt = `你是英文口說考試（全民英檢中級 第二部分問答）的評分老師。
使用者會給你 10 題的題目、時限、學生的口說逐字稿（由瀏覽器語音辨識產生，可能有辨識誤差）、以及反應時間（從題目唸完到開始說話的毫秒數）。

請針對每一題給出：
1. corrected：把學生的回答改成文法正確、道地的版本（若原答案已經很好可以只做小幅修飾）
2. comment：用繁體中文寫 1-2 句具體回饋，指出文法或用詞問題，或稱讚做得好的地方
3. grammar_score：1-5 分（5 分代表文法完全正確）

並給出整體總評 overall：
- summary：用繁體中文寫 3-4 句話總結整體表現
- strengths：陣列，1-3 個具體優點
- weaknesses：陣列，1-3 個具體待加強之處
- reaction_comment：針對反應時間的整體評語（前5題與後5題可分開提及）
- scores：{ grammar: 1-5, fluency: 1-5, content: 1-5, reaction: 1-5 } 四個 1-5 分的整體指標分數

注意：語音辨識逐字稿可能漏字或誤判，評分時可合理推測學生原意，不要因辨識瑕疵過度扣分。

只回傳一個 JSON 物件，格式如下，不要有任何其他文字或 markdown 標記：
{
  "per_question": [ { "index": 1, "corrected": "...", "comment": "...", "grammar_score": 4 }, ... 共10筆 ],
  "overall": { "summary": "...", "strengths": ["..."], "weaknesses": ["..."], "reaction_comment": "...", "scores": { "grammar": 4, "fluency": 3, "content": 4, "reaction": 3 } }
}`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 3000,
        system: systemPrompt,
        messages: [
          { role: "user", content: JSON.stringify(payload) }
        ],
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    let raw = textBlock ? textBlock.text : '{}';
    raw = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    renderResults(parsed);
  } catch (e) {
    analyzingScreen.style.display = 'none';
    showResultsError();
  }
}

function showResultsError() {
  resultsScreen.style.display = 'flex';
  document.getElementById('summaryText').textContent = '分析時發生錯誤，請稍後再試一次。你仍然可以在下方看到各題的逐字稿。';
  const wrap = document.getElementById('qCardsWrap');
  wrap.innerHTML = '';
  results.forEach((r, i) => {
    wrap.appendChild(buildQCard(i, r, null));
  });
}

function buildQCard(i, r, fb) {
  const card = document.createElement('div');
  card.className = 'q-card';
  const reactionText = r.reactionMs !== null ? `反應時間：${(r.reactionMs / 1000).toFixed(1)} 秒` : '反應時間：未偵測到語音';
  const audioHtml = r.audioUrl ? `<audio class="answer-audio" controls src="${r.audioUrl}"></audio>` : '';
  card.innerHTML = `
    <div class="num">第 ${i + 1} 題 · ${r.seconds} 秒</div>
    <div class="qtext">${escapeHtml(r.question)}</div>
    ${audioHtml}
    <div class="field-label">逐字稿</div>
    <div class="your-answer">${escapeHtml(r.transcript || '（沒有偵測到語音）')}</div>
    ${fb ? `
      <div class="field-label">建議修正</div>
      <div class="your-answer" style="color: var(--sage);">${escapeHtml(fb.corrected || '')}</div>
      <div class="feedback">${escapeHtml(fb.comment || '')}</div>
    ` : ''}
    <div class="reaction">${reactionText}</div>
  `;
  return card;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function metricRow(label, score) {
  const row = document.createElement('div');
  row.className = 'metric-row';
  row.innerHTML = `
    <div class="metric-label"><span>${label}</span><span>${score}/5</span></div>
    <div class="metric-bar-bg"><div class="metric-bar-fg" style="width:${score * 20}%;"></div></div>
  `;
  return row;
}

function renderResults(parsed) {
  analyzingScreen.style.display = 'none';
  resultsScreen.style.display = 'flex';

  const overall = parsed.overall || {};
  document.getElementById('summaryText').textContent = overall.summary || '（沒有取得總評）';

  const metricWrap = document.getElementById('metricRows');
  metricWrap.innerHTML = '';
  const scores = overall.scores || {};
  metricWrap.appendChild(metricRow('文法', scores.grammar || 0));
  metricWrap.appendChild(metricRow('流暢度', scores.fluency || 0));
  metricWrap.appendChild(metricRow('內容完整度', scores.content || 0));
  metricWrap.appendChild(metricRow('反應速度', scores.reaction || 0));

  if (overall.reaction_comment) {
    const p = document.createElement('p');
    p.className = 'summary-text';
    p.style.marginTop = '12px';
    p.textContent = '⏱ ' + overall.reaction_comment;
    document.querySelector('.summary-card').appendChild(p);
  }

  const wrap = document.getElementById('qCardsWrap');
  wrap.innerHTML = '';
  const perQ = parsed.per_question || [];
  results.forEach((r, i) => {
    const fb = perQ.find(p => p.index === i + 1);
    wrap.appendChild(buildQCard(i, r, fb));
  });
}

startBtn.addEventListener('click', () => {
  startBtn.disabled = true;
  startBtn.textContent = '準備中…';
  runExam().finally(() => {
    startBtn.disabled = false;
    startBtn.textContent = '開始測驗';
  });
});

restartBtn.addEventListener('click', () => {
  resultsScreen.style.display = 'none';
  introScreen.style.display = 'block';
});
</script>
</body>
